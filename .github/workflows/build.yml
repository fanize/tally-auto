name: Auto Build Tally
on:
  schedule: [{cron: "0 2 * * *"}]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {issues: write, contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/cypressincloud/Tally.git upstream
      - id: up
        run: cd upstream && echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - id: patch
        run: cd upstream && (git apply ../patches/tally-auto.patch && echo "ok=true" >> $GITHUB_OUTPUT) || (echo "ok=false" >> $GITHUB_OUTPUT && echo "Patch failed")
      - if: steps.patch.outputs.ok == 'true'
        name: Fix Maven mirrors for GitHub Actions
        run: |
          cd upstream
          sed -i 's|maven { url = uri("https://maven.aliyun.com/repository/public") }|google()\n        mavenCentral()|g' settings.gradle.kts
          sed -i 's|maven { url = uri("https://maven.aliyun.com/repository/google") }||g' settings.gradle.kts
          sed -i 's|maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }|gradlePluginPortal()|g' settings.gradle.kts
      - if: steps.patch.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with: {java-version: "17", distribution: "microsoft"}
      - if: steps.patch.outputs.ok == 'true'
        run: cd upstream && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - if: steps.patch.outputs.ok == 'true'
        name: Sign APK
        run: |
          cd upstream
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks /tmp/ks.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASS" --key-pass pass:"$KEY_PASS" --out "Tally-auto.apk" aligned.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
      - if: steps.patch.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "tally-${{ steps.up.outputs.sha }}"
          files: upstream/Tally-auto.apk
      - if: steps.patch.outputs.ok == 'false'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title:"Patch failed on ${{ steps.up.outputs.sha }}",body:"Update patches/tally-auto.patch"})
